<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Plan PM Forklift & Traktor 2027 — Enterprise Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* =========================================================
   SKEMA WARNA BARU & TEMA HYBRID / ULTRA-MODERN
   ========================================================= */
:root {
  color-scheme: dark;
  --bg: #0b0f17;
  --card: #131926;
  --card-hover: #1c2436;
  --tx: #f1f5f9;
  --mu: #94a3b8;
  --ac: #0ea5e9;            /* Sky Blue Accent */
  --ac-glow: rgba(14, 165, 233, 0.18);
  --bd: #1e293b;
  --bd-focus: #38bdf8;
  --in: #090d14;
  
  /* Badge Colors */
  --c200: rgba(251, 191, 36, 0.15); --t200: #fbbf24;
  --c400: rgba(56, 189, 248, 0.15); --t400: #38bdf8;
  --c1200: rgba(251, 146, 60, 0.15); --t1200: #fb923c;
  --c2400: rgba(248, 113, 113, 0.15); --t2400: #f87171;
  --c100: rgba(74, 222, 128, 0.15); --t100: #4ade80;
  --c500: rgba(196, 181, 253, 0.15); --t500: #c4b5fd;
  --c1000: rgba(244, 114, 182, 0.15); --t1000: #f472b6;
  --c2000: rgba(248, 113, 113, 0.2); --t2000: #f87171;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--tx);
  padding: 16px clamp(12px, 2.5vw, 24px);
  max-width: 1600px;
  margin: auto;
  min-height: 100vh;
  line-height: 1.5;
}

h1, h2 { color: #f8fafc; font-weight: 700; letter-spacing: -0.02em; }
h1 { font-size: clamp(20px, 2.2vw, 26px); margin: 0; }
h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }

.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(10px);
}

/* Header Aplikasi Utama */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, #131926, #0f172a);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 12px 20px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}
.brand-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.badge-tag {
  background: rgba(14, 165, 233, 0.15); color: #38bdf8; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 8px;
  letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid rgba(56, 189, 248, 0.3);
}
.sync-badge { color: #4ade80; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sync-badge::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 10px #4ade80; }

/* Control Toolbar & Search Row */
.control-toolbar {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) minmax(220px, 1.2fr) minmax(180px, 1fr) auto;
  gap: 12px;
  align-items: end;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}
@media(max-width: 900px) {
  .control-toolbar { grid-template-columns: 1fr 1fr; }
}
@media(max-width: 600px) {
  .control-toolbar { grid-template-columns: 1fr; }
}

.search-box-wrapper { position: relative; }
.search-label { display: block; font-size: 11px; font-weight: 700; color: var(--mu); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
#q, #categoryFilter, #serviceDate {
  width: 100%; font-size: 13px; font-weight: 600; padding: 11px 14px; border: 1px solid var(--bd);
  border-radius: 10px; background: var(--in); color: var(--tx); outline: none; transition: all 0.2s;
}
#q:focus, #categoryFilter:focus, #serviceDate:focus { border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-glow); }

.pdf-btn {
  background: linear-gradient(135deg, #0ea5e9, #0284c7); color: #ffffff; border: none; font-weight: 700;
  padding: 11px 18px; border-radius: 10px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3); transition: all 0.2s; height: fit-content;
}
.pdf-btn:hover { background: linear-gradient(135deg, #38bdf8, #0369a1); transform: translateY(-1px); }
.reset-btn { background: #1e293b !important; color: #f8fafc !important; border: 1px solid #334155 !important; box-shadow: none !important; }
.reset-btn:hover { background: #334155 !important; }

/* Table Wrappers */
.wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--bd); background: var(--in); }
table { border-collapse: collapse; width: 100%; font-size: 12px; text-align: left; }
th { background: #182234; color: #38bdf8; padding: 12px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; border-bottom: 2px solid var(--bd); }
td { border-bottom: 1px solid var(--bd); padding: 10px; text-align: center; white-space: nowrap; color: #cbd5e1; }
td.l { text-align: left; white-space: normal; color: var(--tx); font-weight: 500; }
tr:hover td { background-color: rgba(255, 255, 255, 0.03); }

/* Buttons & Inputs */
button {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--bd);
  background: var(--card); color: var(--tx); cursor: pointer; font-weight: 600; font-size: 12px;
  transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button:hover { background: var(--card-hover); border-color: rgba(56, 189, 248, 0.4); }

/* Navigasi Sidebar */
.app-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
.app-sidebar { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--bd); border-radius: 16px; padding: 14px; min-height: calc(100vh - 32px); }
.sidebar-nav button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; background: transparent; border: 1px solid transparent; color: #94a3b8; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.sidebar-nav button:hover { background: #1a2336; color: #f8fafc; }
.sidebar-nav button.active { background: rgba(14, 165, 233, 0.15); border-color: rgba(56, 189, 248, 0.3); color: #38bdf8; font-weight: 700; }
.sidebar-nav button.active i { color: #38bdf8; }
</style>
</head>
<body>
  <!-- Seluruh konten HTML aplikasi Anda tetap ada di sini -->
</body>
</html>
